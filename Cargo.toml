# =============================================================================
#  R E P S   ·   incremental-lang
# =============================================================================
[package]
name    = "incremental-lang"
version = "1.0.0"

# Minimum Supported Rust Version (MSRV)
rust-version = "1.85"
edition = "2024"

# License
license = "Apache-2.0 OR MIT"

# Readme
readme = "README.md"

# Description
description = "Incremental reparsing for editor tooling: reparse only the region an edit touched."

# Keywords (5 max)
keywords = ["compiler", "language", "incremental", "reparse", "editor"]

# Categories
categories = ["development-tools", "parsing"]

# Links
homepage      = "https://github.com/jamesgober/incremental-lang"
repository    = "https://github.com/jamesgober/incremental-lang"
documentation = "https://docs.rs/incremental-lang"

# Authors
authors = ["James Gober <me@jamesgober.com>"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lib]
name = "incremental_lang"
path = "src/lib.rs"


# FEATURE FLAGS
# #################################
[features]
default = ["std"]
# The standard library. Without it the crate is `no_std` and needs only `alloc`.
std = ["syntax-lang/std"]


# DEPENDENCIES
# #################################
[dependencies]
# The family's concrete syntax tree. Supplies the `Token`, `TokenKind`, and
# `Span` types the grammar contract is written in (re-exported, so they always
# match), and `syntax_lang::Node`, the target of `Tree::to_syntax`.
syntax-lang = { version = "1", default-features = false }


# DEV DEPENDENCIES
# #################################
[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
proptest  = "1"


# BENCHMARKS
# #################################
[[bench]]
name    = "bench"
harness = false


# RELEASE PROFILE
# #################################
[profile.release]
opt-level     = 3
lto           = "fat"
codegen-units = 1
panic         = "abort"
strip         = "symbols"
